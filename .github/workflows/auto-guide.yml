name: Auto guide (AI)

# Writes one AI-assisted guide per run, ONE DAY BEFORE it goes live, so you can review the Pull Request first.
# The guide gets the category's weekly slot as its pubDate (Philippine time, set in automation/config.json):
#   Mon 12:00 PM  MariBank                 (Banks & E-Wallets)
#   Tue 12:00 PM  GCash
#   Wed 12:00 PM  Maya
#   Thu 12:00 PM  More Banks & E-Wallets
#   Fri 12:00 PM  Globe / TM               (Internet Providers)
#   Sat 12:00 PM  Smart / TNT / Sun
#   Sun  9:00 AM  DITO
#   Sun 12:00 PM  More Internet Providers
# The writing runs the evening before at 6:17 PM PH (and 6:47 PM PH on Saturday for the 9:00 AM Sunday DITO slot).
# The site hides a post until its pubDate and the 30-minute deploy then publishes it, so merging early is safe.
# GitHub may start scheduled runs 5 to 30 minutes late when it is busy. That is normal.
# If a run is delayed past midnight (Philippine time) it still writes for that same day, never a day too late or early.
# If the category already has a guide on that date (drafts and scheduled ones count), nothing is written.
#
# MODE (repository variable AUTO_GUIDE_MODE, Settings > Secrets and variables > Actions > Variables):
#   pr       (default) opens a Pull Request. The guide goes live only after you merge it.
#   publish  commits straight to main. Posts with unverified numbers or no source are still saved as draft.

on:
  schedule:
    - cron: "17 10 * * *" # every day 6:17 PM PH: writes tomorrow's guide (Sunday's 12:00 PM guide on Saturday)
    - cron: "47 10 * * 6" # Saturday 6:47 PM PH: writes Sunday's 9:00 AM guide (DITO)
  workflow_dispatch:
    inputs:
      category:
        description: Which category to write
        type: choice
        options:
          - maribank
          - gcash
          - maya
          - more-banks-ewallets
          - globe-tm
          - smart-tnt-sun
          - dito
          - more-internet-providers
        default: maribank
      topic:
        description: "Topic (optional). Describe the guide you want, e.g. How to open a line on the Smart 5G Max WiFi. Empty = the next unwritten topic"
        type: string
        required: false
      date:
        description: "Publish date, YYYY-MM-DD (leave empty = this category's next free weekly slot)"
        type: string
        required: false
      mode:
        description: pr = open a Pull Request, publish = commit to main
        type: choice
        options: [pr, publish]
        default: pr

permissions:
  contents: write
  pull-requests: write
  models: read # lets the built-in token call GitHub Models (free AI fallback, no key needed)

concurrency:
  group: auto-guide
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide category, publish date and mode
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_CATEGORY: ${{ inputs.category }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MODE: ${{ inputs.mode }}
          VAR_MODE: ${{ vars.AUTO_GUIDE_MODE }}
        run: |
          set -euo pipefail
          if [ -n "$SCHEDULE" ]; then
            # Normal case (evening run): the guide is for tomorrow. After a very late start (past midnight in Manila,
            # before noon) the day has already changed, so the guide is for today.
            HOUR=$((10#$(TZ=Asia/Manila date +%H)))
            if [ "$HOUR" -lt 12 ]; then
              TARGET=$(TZ=Asia/Manila date +%F)
            else
              TARGET=$(TZ=Asia/Manila date -d tomorrow +%F)
            fi
            # The schedule lives in automation/config.json. The Saturday 6:47 PM run takes the earliest slot of Sunday (DITO).
            WHICH=last
            if [ "$SCHEDULE" = "47 10 * * 6" ]; then WHICH=first; fi
            CATEGORY=$(node scripts/pick-category.mjs "$TARGET" "$WHICH")
          else
            CATEGORY="${INPUT_CATEGORY:-maribank}"
            TARGET="${INPUT_DATE:-}"
          fi
          MODE="${INPUT_MODE:-${VAR_MODE:-pr}}"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Writing a $CATEGORY guide for ${TARGET:-the next free slot}, mode: $MODE"

      - name: Write the guide
        id: gen
        run: node scripts/generate-guide.mjs
        env:
          CATEGORY: ${{ steps.plan.outputs.category }}
          TARGET_DATE: ${{ steps.plan.outputs.date }}
          TOPIC: ${{ inputs.topic }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # A pull request made with the built-in token cannot start other workflows, so the safety check runs here.
      - name: Install dependencies
        if: steps.gen.outputs.slug != ''
        run: npm ci

      - name: Check that the site still builds and every link works
        id: verify
        if: steps.gen.outputs.slug != ''
        continue-on-error: true
        env:
          # The new guide has a future pubDate. Without this the build would leave it out and the link check would pass for nothing.
          INCLUDE_SCHEDULED: "1"
        run: |
          npx astro build
          node scripts/check-links.mjs --report .autoguide-report.md

      - name: Warn in the pull request if the check failed
        if: steps.gen.outputs.slug != '' && steps.verify.outcome == 'failure'
        run: |
          printf '\n\n### ❌ Check failed\nThe site did not build, or a link is broken, with this guide. Open the "Check that the site still builds" step in the Actions log, fix the guide, then merge.\n' >> .autoguide-report.md

      - name: Decide how to deliver the guide
        id: deliver
        if: steps.gen.outputs.slug != ''
        env:
          PLANNED_MODE: ${{ steps.plan.outputs.mode }}
          CHECK: ${{ steps.verify.outcome }}
        run: |
          MODE="$PLANNED_MODE"
          # Never publish straight to the live site after a failed check: use a pull request instead.
          if [ "$CHECK" != "success" ]; then MODE=pr; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Delivering by: $MODE"

      - name: Open a Pull Request
        if: steps.gen.outputs.slug != '' && steps.deliver.outputs.mode == 'pr'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            src/posts
            automation/topics-ai
          branch: auto-guide/${{ steps.gen.outputs.slug }}
          delete-branch: true
          commit-message: "Add AI guide: ${{ steps.gen.outputs.title }}"
          title: "Review: ${{ steps.gen.outputs.title }} (live ${{ steps.gen.outputs.pubdate }})"
          body-path: .autoguide-report.md

      - name: Commit straight to main
        if: steps.gen.outputs.slug != '' && steps.deliver.outputs.mode == 'publish'
        env:
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/posts automation/topics-ai
          git commit -m "Add AI guide: $TITLE"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          # Pushes made with the built-in token do not start the deploy workflow,
          # but deploy.yml rebuilds every 30 minutes, so the guide goes live at its pubDate (within half an hour).
