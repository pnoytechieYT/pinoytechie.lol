name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every 30 minutes so scheduled posts (pubDate in the future)
  # go live automatically once their publish time has passed.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      # Keeps the last successful YouTube sync between runs, so a short YouTube outage
      # never removes your newest videos from the site. (Expires on its own, as YouTube requires.)
      - name: Restore last YouTube data
        uses: actions/cache@v4
        with:
          path: .cache
          key: youtube-${{ github.run_id }}
          restore-keys: |
            youtube-

      - name: Build with Astro
        run: npm run build
        env:
          # Secret you saved in Settings > Secrets and variables > Actions
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
